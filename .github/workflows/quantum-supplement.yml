name: quantum-stock-supplement
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quantum-stock-supplement
  cancel-in-progress: false
jobs:
  supplement:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Yahoo-Datenclient installieren
        run: python -m pip install yfinance==1.1.0
      - name: Angeforderte Einzelanalysen ergänzen
        env:
          QUANTUM_SYNC_TOKEN: ${{ secrets.QUANTUM_SYNC_TOKEN }}
        run: python quantum_sync/on_demand.py

