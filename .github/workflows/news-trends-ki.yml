name: news-trends-ki
# KI-Einordnung der Nachrichten-Trends (news_trends_ki_v1, NACHRICHTEN_TRENDS.md): ein Aufruf von Claude Haiku 5.5 je Lauf.
# Wöchentlich montags und manuell. Braucht das Secret ANTHROPIC_API_KEY; ohne Secret wird nichts aufgerufen.
# Kosten: etwa 0,003 $ je Lauf; Monatsbudget im Code (KI_BUDGET_USD 1 $), Grenze in der Anthropic Console 2 $.
on:
  schedule:
    - cron: '31 7 * * 1'
  workflow_dispatch: {}
concurrency:
  group: news-trends
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ki:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: SDK installieren
        run: pip install anthropic==2.12.0
      - name: Regeln testen (ohne API)
        run: python -m unittest discover -s value_radar/nachrichten_trends -p 'test_*.py'
      - name: KI-Einordnung erstellen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python value_radar/nachrichten_trends/ki_einordnung.py value_radar/daten
      - name: Ergebnis und Kostenprotokoll speichern
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'value-radar-bot'
          git config user.email 'bot@value-radar'
          for f in cf_trends_ki.json ki_kosten.json; do
            if test -s "value_radar/daten/$f"; then git add "value_radar/daten/$f"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m 'KI-Einordnung der Trends [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
