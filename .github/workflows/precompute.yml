name: value-radar-update

# EINMAL taeglich. 06:00 UTC = 08:00 deutscher Sommerzeit, 07:00 Winterzeit.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    # 60 statt 45 Minuten: Reine Sicherheitsmarge. Das eigentliche Limit setzt
    # PRECOMPUTE_BUDGET_MIN weiter unten - der Lauf stoppt sich selbst und
    # SPEICHERT, statt von GitHub hart abgeschnitten zu werden. Der Unterschied
    # ist entscheidend: Lauf #162 lief 45m23s und hinterliess nichts.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        working-directory: value_radar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Neu berechnen (Scores, Radar, Quantum, Portfolio, Hedgefonds)
        working-directory: value_radar
        env:
          # --- Zeitsteuerung ---
          # Der Lauf bricht seine Scans nach 80 % dieses Budgets ab und nutzt
          # den Rest zum Speichern. Optionale Abschnitte (Earnings-Call-Suche,
          # KI-Briefing, Auto-Depot) entfallen vorher.
          PRECOMPUTE_BUDGET_MIN: "38"
          # Titel fuer die Earnings-Call-Suche. Der teuerste Einzelabschnitt.
          TRANSKRIPT_DECKEL: "400"
          # --- Pflicht: Speicher ---
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # --- Pflicht: Datenquellen ---
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # --- Optional ---
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_BRIEFING_MODEL: ${{ secrets.AI_BRIEFING_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python precompute.py
