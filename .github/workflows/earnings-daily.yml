name: earnings-daily

# TAEGLICH nur die Earnings-Call-Suche. Schnell (~5 min), weil sich Calls
# taeglich aendern - im Gegensatz zu Fundamentaldaten (die laufen alle 3 Tage
# im precompute-3tage-Workflow).
on:
  schedule:
    - cron: "0 6 * * *"    # 06:00 UTC taeglich
  workflow_dispatch: {}

jobs:
  earnings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        working-directory: value_radar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Earnings Calls suchen
        working-directory: value_radar
        env:
          NETZ_TIMEOUT_S: "20"
          TRANSKRIPT_DECKEL: "600"
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
        run: python earnings_only.py
