name: themen-des-tages
# Themen des Tages (daily_topics_ki_v1, value_radar/ki/themen_des_tages.py): Markt, Aktien und Welt aus den Schlagzeilen,
# ein Aufruf von Claude Haiku 5.5 je Tag. Budget-Anteil 0,20 $/Monat (value_radar/ki/kosten.py). Ohne Secret kein Aufruf.
on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch: {}
concurrency:
  group: news-trends
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ki:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: SDK installieren
        run: pip install anthropic==2.12.0
      - name: Regeln testen (ohne API)
        run: python -m unittest discover -s value_radar/ki -p 'test_*.py'
      - name: Themen des Tages erstellen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python value_radar/ki/themen_des_tages.py value_radar/daten
      - name: Ergebnis und Kostenprotokoll speichern
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'value-radar-bot'
          git config user.email 'bot@value-radar'
          for f in cf_themen_tag.json ki_kosten.json; do
            if test -s "value_radar/daten/$f"; then git add "value_radar/daten/$f"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m 'Themen des Tages [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
