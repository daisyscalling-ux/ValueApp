name: news-trends-ki
# KI-Einordnung der Nachrichten-Trends (news_trends_ki_v1, NACHRICHTEN_TRENDS.md): ein Aufruf von Claude Haiku 5.5 je Lauf.
# Täglich um 9 Uhr Berliner Zeit (seit 23.11.2026, vorher wöchentlich): gestartet vom Cloudflare-Worker (worker/laufplan.ts in
# valueapp-cf, pünktlich). Der Zeitplan hier ist nur Rückfall und überspringt, wenn heute schon eine Einordnung entstand
# (value_radar/ki/laufwache.py). Kosten rund 0,0055 $ je Lauf, Budgetanteil 0,20 $/Monat (value_radar/ki/kosten.py).
on:
  schedule:
    - cron: '17 10 * * *'    # Rückfall, 11:17 bzw. 12:17 Berliner Zeit
  workflow_dispatch: {}
concurrency:
  group: news-trends-ki
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  ki:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: SDK installieren
        run: pip install anthropic==2.12.0
      - name: Regeln testen (ohne API)
        run: python -m unittest discover -s value_radar/nachrichten_trends -p 'test_*.py'
      - name: KI-Einordnung erstellen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LAUF_ANLASS: ${{ github.event_name }}
        run: python value_radar/nachrichten_trends/ki_einordnung.py value_radar/daten
      - name: Ergebnis und Kostenprotokoll speichern
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'value-radar-bot'
          git config user.email 'bot@value-radar'
          for f in cf_trends_ki.json ki_kosten.json; do
            if test -s "value_radar/daten/$f"; then git add "value_radar/daten/$f"; fi
          done
          git diff --cached --quiet && exit 0
          git commit -m 'KI-Einordnung der Trends [skip ci]'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1
