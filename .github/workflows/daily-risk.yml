name: daily-risk

on:
  workflow_run:
    workflows: [precompute-3tage]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'value_radar/risk_precompute/**'
      - 'value_radar/regulatory_export/import_credit_quality.py'
      - 'value_radar/regulatory_export/fed-capital-requirements.json'
      - 'value_radar/regulatory_export/reviewed-liquidity.json'
      - 'value_radar/regulatory_export/eu-bank-map.json'
      - 'value_radar/daten/regulatory/eu-bank-capital.json'
      - 'value_radar/regulatory_export/intl-bank-map.json'
      - 'value_radar/daten/regulatory/intl-bank-metrics.json'
      - 'value_radar/daten/regulatory/bhcf-credit-quality.json'
      - 'value_radar/fundamental_export/queue_policy.py'
      - 'value_radar/fundamental_export/export_fundamentals.py'
      - 'value_radar/fundamental_export/test_annual_supply_status.py'
      - '.github/workflows/daily-risk.yml'
      - 'value_radar/listing_reference.py'
      - 'value_radar/reviewed_listing_reference.json'
      - 'value_radar/peer_metadata.py'
      - 'value_radar/export_cf.py'
      - 'value_radar/listing_identity.py'
      - 'value_radar/fundamental_export/listing_identity.py'

concurrency:
  group: daily-risk-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  tests:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python value_radar/fundamental_export/test_queue_policy.py
      - run: python value_radar/fundamental_export/test_annual_supply_status.py
      - run: python value_radar/risk_precompute/test_yahoo_benchmarks.py
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_recover_listing_metadata.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_*company_news.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_peer_groups.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_yahoo_sector.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_market_priority.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_roic_risk_annual.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_edinet.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_financial_supply_policy.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_coverage_delta.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_risk_workplan.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_ecb_fx.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_risk_app_export.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_regulatory*.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_fed_capital_requirements.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_financial_history.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_history_backfill.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_sec*.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_run_integrity.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_bulk_workflows.py'
      - run: |
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-adaptive-roic-rate.ts --bundle --platform=node --format=esm --outfile=/tmp/test-adaptive-rate.mjs
          node /tmp/test-adaptive-rate.mjs
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_risk_evidence.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_risk_review.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_feature_snapshot.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_risk_construct_coverage.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_risk_history_proxy.py'
      - run: python -m unittest discover -s value_radar/risk_precompute -p 'test_listing_isin_audit.py'
      - run: python -m unittest discover -s value_radar/regulatory_export -p 'test_credit_quality.py'
      - run: |
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-regulatory-context.ts --bundle --platform=node --format=esm --outfile=/tmp/test-regulatory-context.mjs
          node /tmp/test-regulatory-context.mjs
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-holding-liquidity.ts --bundle --platform=node --format=esm --outfile=/tmp/test-holding-liquidity.mjs
          node /tmp/test-holding-liquidity.mjs
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-history-backfill.ts --bundle --platform=node --format=esm --outfile=/tmp/test-history-backfill.mjs
          node /tmp/test-history-backfill.mjs
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-capital-requirement.ts --bundle --platform=node --format=esm --outfile=/tmp/test-capital-requirement.mjs
          node /tmp/test-capital-requirement.mjs
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-regulatory-credit.ts --bundle --platform=node --format=esm --outfile=/tmp/test-regulatory-credit.mjs
          node /tmp/test-regulatory-credit.mjs
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-eu-capital.ts --bundle --platform=node --format=esm --outfile=/tmp/test-eu-capital.mjs
          node /tmp/test-eu-capital.mjs
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-intl-capital.ts --bundle --platform=node --format=esm --outfile=/tmp/test-intl-capital.mjs
          node /tmp/test-intl-capital.mjs
      - run: |
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-fx-context.ts --bundle --platform=node --format=esm --outfile=/tmp/test-fx-context.mjs
          node /tmp/test-fx-context.mjs
      - run: |
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-universe.ts --bundle --platform=node --format=esm --outfile=/tmp/test-universe.mjs
          node /tmp/test-universe.mjs
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-home-histories.ts --bundle --platform=node --format=esm --outfile=/tmp/test-home-histories.mjs
          node /tmp/test-home-histories.mjs
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-edinet.ts --bundle --platform=node --format=esm --outfile=/tmp/test-edinet.mjs
          node /tmp/test-edinet.mjs
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-balance-fields.ts --bundle --platform=node --format=esm --outfile=/tmp/test-balance-fields.mjs
          node /tmp/test-balance-fields.mjs
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-context.ts --bundle --platform=node --format=esm --outfile=/tmp/test-context.mjs
          node /tmp/test-context.mjs
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-sector.ts --bundle --platform=node --format=esm --outfile=/tmp/test-sector.mjs
          node /tmp/test-sector.mjs
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-broad-sector.ts --bundle --platform=node --format=esm --outfile=/tmp/test-broad-sector.mjs
          node /tmp/test-broad-sector.mjs
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/test-industry-context.ts --bundle --platform=node --format=esm --outfile=/tmp/test-industry-context.mjs
          node /tmp/test-industry-context.mjs
  risk:
    concurrency:
      group: roic-bulk-production
      cancel-in-progress: false
      queue: max
    needs: tests
    if: github.event_name != 'pull_request' 
    runs-on: ubuntu-latest
    timeout-minutes: 275
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verwendeten Universumsstand festhalten
        run: python value_radar/risk_precompute/run_integrity.py capture value_radar/daten /tmp/risk-input.json
      - name: Fehlende Notierungsdaten getrennt von Finanzdaten ergaenzen
        timeout-minutes: 10
        env:
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
        run: python value_radar/risk_precompute/recover_listing_metadata.py
      - name: ISIN der OTC-Stammaktien gegen die exakte Notierung pruefen (nur Bericht)
        continue-on-error: true
        timeout-minutes: 6
        env:
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
        run: python value_radar/risk_precompute/listing_isin_audit.py value_radar/daten
      - name: Letzte veroeffentlichte Abdeckung fuer Vergleich sichern
        run: |
          if test -s value_radar/daten/cf_risk_coverage.json; then cp value_radar/daten/cf_risk_coverage.json /tmp/risk-coverage-before.json; fi
      - name: Universumsweite Datenpruefung und Warteschlange vorbereiten
        run: |
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/audit-universe.ts --bundle --platform=node --format=esm --outfile=/tmp/risk-audit.mjs
          python value_radar/risk_precompute/fed_capital_requirements.py
          python value_radar/risk_precompute/regulatory_context.py
          node /tmp/risk-audit.mjs
      - name: Yahoo-Helfer installieren
        continue-on-error: true
        run: python -m pip install "yfinance==0.2.66"
      - name: Yahoo-Datenpruefung testen
        run: python value_radar/risk_precompute/test_yahoo_benchmarks.py
      - name: Markt-ETFs als Ersatzquelle laden
        timeout-minutes: 17
        continue-on-error: true
        run: python value_radar/risk_precompute/yahoo_benchmarks.py
      - uses: actions/cache@v4
        with:
          path: .risk-validation-cache.json
          key: risk-validation-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: risk-validation-v2-
      - uses: actions/cache/restore@v4
        with:
          path: .risk-sector-series.json
          key: risk-sector-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: risk-sector-v1-
      - name: Exportprogramm bauen
        run: npx --yes esbuild@0.24.2 value_radar/risk_precompute/export-risk.ts --bundle --platform=node --format=esm --outfile=/tmp/risk-export.mjs
      - name: Historische Berechnung testen
        run: |
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/validation-check.ts --bundle --platform=node --format=esm --outfile=/tmp/risk-validation-check.mjs
          node /tmp/risk-validation-check.mjs
      - name: Risiko-Historien vorberechnen
        env:
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
          RISK_BUDGET_MIN: '90'
          RISK_VALIDATION_ENABLED: '1'
          RISK_SECTOR_ENABLED: '1'
          RISK_REQUESTS_PER_MINUTE: '240'
        run: node /tmp/risk-export.mjs
      - name: Heimatnotierungen ausserhalb des Universums fuer fehlende Kurshistorien laden
        if: always() && !cancelled()
        continue-on-error: true
        timeout-minutes: 12
        env:
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
        run: |
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/export-home-histories.ts --bundle --platform=node --format=esm --outfile=/tmp/home-histories.mjs
          node /tmp/home-histories.mjs
      - name: Fehlende eigene Kurshistorien durch gekennzeichnete Heimatnotierung ersetzen
        if: always() && !cancelled()
        continue-on-error: true
        run: python value_radar/risk_precompute/risk_history_proxy.py value_radar/daten
      - name: Unternehmensnachrichten universumsweit erfassen
        if: always() && !cancelled()
        timeout-minutes: 22
        env:
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
          NEWS_BUDGET_MIN: '20'
        run: python value_radar/risk_precompute/company_news.py
      - name: Aktuelle Kalenderluecken vor dem Ersatzabruf pruefen
        if: always() && !cancelled()
        run: |
          python value_radar/risk_precompute/peer_groups.py
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/export-sector.ts --bundle --platform=node --format=esm --outfile=/tmp/risk-sector.mjs
          node /tmp/risk-sector.mjs
      - name: Fehlende Kursreihen und feinere Branchenangaben ergaenzen
        if: always() && !cancelled()
        timeout-minutes: 23
        env:
          SECTOR_YAHOO_BUDGET_MIN: '20'
        run: python value_radar/risk_precompute/yahoo_sector.py
      - name: Vergleichsgruppen nach Geschaeftsmodell und Emittent vorbereiten
        if: always() && !cancelled()
        run: python value_radar/risk_precompute/peer_groups.py
      - name: Historische EZB-Referenzkurse laden
        if: always() && !cancelled()
        timeout-minutes: 2
        continue-on-error: true
        run: python value_radar/risk_precompute/ecb_fx.py
      - name: Zeitgleiche Branchenvergleiche berechnen
        if: always() && !cancelled()
        run: |
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/export-sector.ts --bundle --platform=node --format=esm --outfile=/tmp/risk-sector.mjs
          node /tmp/risk-sector.mjs
      - uses: actions/cache/save@v4
        if: always() && !cancelled() && hashFiles('.risk-sector-series.json') != ''
        with:
          path: .risk-sector-series.json
          key: risk-sector-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fehlende Risiko-Jahresabschluesse aus ROIC ergaenzen
        if: always() && !cancelled()
        timeout-minutes: 14
        env:
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
        run: python value_radar/risk_precompute/roic_risk_annual.py
      - name: Japanische Originalabschluesse gesammelt laden
        if: always() && !cancelled()
        timeout-minutes: 31
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: python value_radar/risk_precompute/edinet_supply.py
      - name: Mehrjaehrige Originalabschluesse gesammelt nachladen
        if: always() && !cancelled()
        timeout-minutes: 32
        env:
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
          HISTORY_BACKFILL_BUDGET_S: '1800'
        run: python value_radar/risk_precompute/history_backfill.py
      - name: Historische SEC-Cashflows gesammelt ergaenzen
        if: always() && !cancelled()
        timeout-minutes: 17
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python value_radar/risk_precompute/sec_cashflow_history.py
      - name: Abdeckung nach dem Lauf neu pruefen
        id: riskpack
        if: always() && !cancelled()
        run: |
          python value_radar/risk_precompute/regulatory_context.py
          node /tmp/risk-audit.mjs
          python value_radar/risk_precompute/financial_supply_policy.py
          python value_radar/risk_precompute/coverage_delta.py
          npx --yes esbuild@0.24.2 value_radar/risk_precompute/export-history-backfill.ts --bundle --platform=node --format=esm --outfile=/tmp/history-backfill.mjs
          node /tmp/history-backfill.mjs
          python value_radar/risk_precompute/financial_history.py
          python value_radar/risk_precompute/risk_workplan.py
          python value_radar/risk_precompute/risk_app_export.py
          python value_radar/risk_precompute/run_integrity.py seal value_radar/daten /tmp/risk-input.json
          python value_radar/risk_precompute/risk_evidence.py
          python value_radar/risk_precompute/risk_app_export.py
          python value_radar/risk_precompute/run_integrity.py seal value_radar/daten /tmp/risk-input.json
      - name: Rohdaten aller Risikobloecke taeglich archivieren
        if: ${{ always() && !cancelled() && steps.riskpack.outcome == 'success' }}
        continue-on-error: true
        run: python value_radar/risk_precompute/feature_snapshot.py value_radar/daten
      - name: Abdeckung des Risiko-Konstrukts je Block und Profil messen
        if: ${{ always() && !cancelled() && steps.riskpack.outcome == 'success' }}
        continue-on-error: true
        run: python value_radar/risk_precompute/risk_construct_coverage.py value_radar/daten
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: risk-universe-coverage-${{ github.run_id }}
          path: |
            value_radar/daten/cf_risk_coverage.json
            value_radar/daten/cf_risk_queue.json
            value_radar/daten/cf_company_news.json
            value_radar/daten/cf_news_identity_audit.json
            value_radar/daten/cf_news_supply_plan.json
            value_radar/daten/cf_peer_groups.json
            value_radar/daten/cf_sector_context.json
            value_radar/daten/cf_peer_metadata.json
            value_radar/daten/cf_sector_supply_plan.json
            value_radar/daten/cf_ecb_fx.json
            value_radar/daten/cf_listing_recovery.json
            value_radar/daten/cf_listing_isin_audit.json
            value_radar/daten/cf_roic_risk_annual.json
            value_radar/daten/cf_edinet_cashflow.json
            value_radar/daten/cf_financial_supply_plan.json
            value_radar/daten/cf_risk_coverage_changes.json
            value_radar/daten/cf_risk_event_review.json
            value_radar/daten/cf_sector_review_packets.json
            value_radar/daten/cf_risk_observation_status.json
            value_radar/daten/risk_observations/
            value_radar/daten/cf_risk_workplan.json
            value_radar/daten/cf_sec_cashflow_history.json
            value_radar/daten/cf_roic_history.json
            value_radar/daten/cf_history_backfill_balances.json
            value_radar/daten/cf_financial_history.json
            value_radar/daten/cf_capital_requirements.json
            value_radar/daten/cf_regulatory_context.json
            value_radar/daten/cf_risk_run_integrity.json
            value_radar/daten/cf_risk_app_manifest.json
            value_radar/daten/risk_app/
          retention-days: 90
      - name: Ergebnisse und Teilfortschritt veroeffentlichen
        if: ${{ always() && !cancelled() && steps.riskpack.outcome == 'success' }}
        run: |
          set -euo pipefail
          test -s value_radar/daten/cf_risk.json || exit 0
          git config user.name 'value-radar-bot'
          git config user.email 'bot@value-radar'
          git add value_radar/daten/cf_risk.json
          if test -s value_radar/daten/cf_risk_app_manifest.json; then git add value_radar/daten/cf_risk_app_manifest.json value_radar/daten/risk_app; fi
          if test -d value_radar/daten/risk_observations; then git add value_radar/daten/risk_observations; fi
          for file in cf_risk_event_review.json cf_sector_review_packets.json cf_risk_observation_status.json cf_risk_run_integrity.json cf_sec_cashflow_history.json cf_roic_history.json cf_financial_history.json cf_capital_requirements.json cf_regulatory_context.json cf_ecb_fx.json cf_risk_workplan.json cf_risk_coverage_changes.json cf_edinet_cashflow.json cf_financial_supply_plan.json cf_roic_risk_annual.json cf_universum.json cf_listing_recovery.json cf_listing_isin_audit.json cf_risk_coverage.json cf_risk_queue.json cf_company_news.json cf_news_identity_audit.json cf_news_supply_plan.json cf_peer_groups.json cf_sector_context.json cf_peer_metadata.json cf_sector_supply_plan.json cf_risk_construct_coverage.json; do
            if test -s "value_radar/daten/$file"; then git add "value_radar/daten/$file"; fi
          done
          if test -s value_radar/daten/cf_risk_validation.json; then git add value_radar/daten/cf_risk_validation.json; fi
          git diff --cached --quiet && exit 0
          git commit -m 'Risikodaten aktualisiert [skip ci]'
          for attempt in 1 2 3; do
            git fetch origin main
            python value_radar/risk_precompute/run_integrity.py remote value_radar/daten /tmp/risk-input.json
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1







