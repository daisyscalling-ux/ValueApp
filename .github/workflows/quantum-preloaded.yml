name: quantum-preloaded-import
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [value_radar/daten/cf_universum.json]
permissions:
  contents: read
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Vorberechnetes Universum importieren
        env:
          QUANTUM_SYNC_TOKEN: ${{ secrets.QUANTUM_SYNC_TOKEN }}
        run: python quantum_sync/import_preloaded.py

