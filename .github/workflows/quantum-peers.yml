name: quantum-peer-universe
on:
  schedule:
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: quantum-peer-universe
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Kennzahlen prüfen
        run: python -m unittest discover -s value_radar -p test_quantum_peers.py
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Yahoo-Zusatzdaten vorbereiten
        run: python -m pip install yfinance==1.1.0
      - name: Bewertungs-Engine prüfen
        run: python -m unittest discover -s quantum_sync
      - name: Screener und Branchenkennzahlen aktualisieren
        env:
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          QUANTUM_SYNC_TOKEN: ${{ secrets.QUANTUM_SYNC_TOKEN }}
          QUANTUM_URL: https://quantum-equity-research.daisyscalling.workers.dev
          QUANTUM_BUDGET_MIN: '6'
          QUANTUM_MAX_COMPANIES: '150'
        run: node quantum_sync/sync.mjs
