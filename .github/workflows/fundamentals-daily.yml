name: fundamentals-daily
on:
  pull_request:
    paths:
      - 'value_radar/fundamental_export/**'
      - 'value_radar/listing_identity.py'
      - 'value_radar/roic.py'
      - 'value_radar/export_cf.py'
      - 'value_radar/tests/test_listing_identity.py'
      - '.github/workflows/fundamentals-daily.yml'
  schedule:
    - cron: '37 6 * * *'
  workflow_dispatch:
    inputs:
      symbols:
        description: 'Optional: comma-separated existing universe tickers, e.g. MU,MSFT,SAP.DE'
        required: false
        default: ''
concurrency:
  group: fundamentals-daily
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - working-directory: value_radar/fundamental_export
        run: python -m unittest -v test_export_fundamentals.py
      - working-directory: value_radar
        run: python -m unittest discover -s tests -p test_listing_identity.py
  collect:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install yfinance==0.2.66 pandas==2.3.3
      - name: Offline checks
        working-directory: value_radar/fundamental_export
        run: python -m unittest -v test_export_fundamentals.py
      - name: Collect dated blocks (bounded and resumable)
        working-directory: value_radar
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          REQUESTED_SYMBOLS: ${{ inputs.symbols }}
        run: python fundamental_export/export_fundamentals.py --symbols "$REQUESTED_SYMBOLS" --budget-min 120
      - name: Preserve checkpoints even when some providers failed
        if: always()
        run: |
          if [ ! -d value_radar/daten/fundamentals ]; then exit 1; fi
          git config user.name value-radar-bot
          git config user.email bot@value-radar
          git add value_radar/daten/fundamentals
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh dated fundamental observations [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main


