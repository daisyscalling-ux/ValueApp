name: precompute-3tage

# Taeglicher grosser Lauf: Fundamentaldaten, Fair Value, Scores fuer das
# grosse Universum (S&P500 + NASDAQ100 + STOXX600 + Nikkei225, ~1350 Titel).
# Schreibt ins Google Sheet (Streamlit) UND als JSON (Cloudflare).
#
# 01:17 UTC. Der historische Workflowname bleibt fuer bestehende Aufrufer erhalten.
on:
  pull_request:
    paths:
      - '.github/workflows/precompute-3tage.yml'
      - 'value_radar/publish_cf.py'
      - 'value_radar/export_cf.py'
      - 'value_radar/export_continuity.py'
      - 'value_radar/tests/test_export_continuity.py'
      - 'value_radar/tests/test_publish_cf.py'
      - 'value_radar/tests/test_index_continuity.py'
      - 'value_radar/tests/test_ebitda_margin_fallback.py'
      - 'value_radar/tests/test_playbook_sector.py'
      - 'value_radar/valuation.py'
      - 'value_radar/sektor.py'
      - 'value_radar/ebitda_margin_fallback.py'
      - 'value_radar/index_membership.py'
      - 'value_radar/sp500_liste.txt'
      - 'value_radar/roic.py'
      - 'value_radar/risk_precompute/app-copies.json'
      - 'value_radar/risk_precompute/app_copies.py'
      - 'value_radar/providers.py'
      - 'value_radar/tests/test_roic_52w.py'
      - 'value_radar/ts_bewertung.py'
      - 'value_radar/precompute.py'
      - 'value_radar/tests/test_ts_bewertung.py'
      - 'value_radar/risk_precompute/scanner-evaluate.ts'
      - 'value_radar/risk_precompute/src/lib/**'
  schedule:
    - cron: "17 1 * * *"    # daily
  workflow_dispatch: {}

concurrency:
  group: precompute-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
  queue: max

jobs:
  publication-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: App-Kopien identisch mit valueapp-cf (app-copies.json)
        run: python value_radar/risk_precompute/app_copies.py
      - name: App-Rechenweg bauen und pruefen
        run: npx --yes esbuild@0.24.2 value_radar/risk_precompute/scanner-evaluate.ts --bundle --platform=node --format=esm --outfile=value_radar/risk_precompute/.build/scanner-evaluate.mjs
      - working-directory: value_radar
        env:
          SCANNER_EVAL_JS: ${{ github.workspace }}/value_radar/risk_precompute/.build/scanner-evaluate.mjs
        run: python -m unittest discover -s tests -p test_ts_bewertung.py -v
      - working-directory: value_radar
        run: python -m unittest discover -s tests -p test_roic_52w.py -v
      - working-directory: value_radar
        run: python -m unittest discover -s tests -p 'test_*continuity.py' -v
      - working-directory: value_radar
        run: python -m unittest discover -s tests -p test_publish_cf.py -v
      - working-directory: value_radar
        run: python -m unittest discover -s tests -p test_ebitda_margin_fallback.py -v
      - working-directory: value_radar
        run: python -m unittest discover -s tests -p test_playbook_sector.py -v
  precompute:
    concurrency:
      group: roic-bulk-production
      cancel-in-progress: false
      queue: max
    if: github.event_name != 'pull_request'
    needs: publication-test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # noetig fuer git push (sonst 403)
    # 180 min: roic-Ratenlimit (300/min) bremst, nicht das GitHub-Fenster.
    # ~1350 Titel x 15 Aufrufe / 300 = ~67 min reine Abrufzeit + Puffer.
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        working-directory: value_radar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1) Streamlit-Nachtlauf (Sheet) - das grosse Universum
      - name: Streamlit-Daten berechnen
        working-directory: value_radar
        env:
          UNIVERSE_SIZE: "600"
          MOM_UNIVERSE_SIZE: "400"
          RADAR_MARKT: "200"
          PRECOMPUTE_BUDGET_MIN: "80"
          NETZ_TIMEOUT_S: "20"
          TRANSKRIPT_DECKEL: "0"     # Earnings laeuft im taeglichen Workflow
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python precompute.py

      # 2a) Bewertung im App-Rechenweg (evaluateStock) bauen; export_cf.py ruft ihn ueber ts_bewertung.py auf
      - name: App-Rechenweg bauen
        run: npx --yes esbuild@0.24.2 value_radar/risk_precompute/scanner-evaluate.ts --bundle --platform=node --format=esm --outfile=value_radar/risk_precompute/.build/scanner-evaluate.mjs
      # 2) Cloudflare-Export (JSON) - dasselbe Universum, schlank
      - name: Cloudflare-JSON exportieren
        working-directory: value_radar
        env:
          SCANNER_EVAL_JS: ${{ github.workspace }}/value_radar/risk_precompute/.build/scanner-evaluate.mjs
          EXPORT_BUDGET_MIN: "160"
          NETZ_TIMEOUT_S: "20"
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python export_cf.py

      # Keep the expensive result downloadable even if publishing fails.
      - name: Export als Artefakt sichern
        uses: actions/upload-artifact@v4
        with:
          name: cf-universum-${{ github.run_id }}
          path: value_radar/daten/cf_universum.json
          if-no-files-found: error
          retention-days: 7
      # Other data jobs may have updated main during the long computation.
      - name: Aktuellen Stand fuer Veroeffentlichung laden
        uses: actions/checkout@v6
        with:
          ref: main
          path: publication
          fetch-depth: 0
      - name: JSON mit Konfliktpruefung veroeffentlichen
        run: |
          git -C publication config user.name "value-radar-bot"
          git -C publication config user.email "bot@value-radar"
          python value_radar/publish_cf.py publication value_radar/daten/cf_universum.json


