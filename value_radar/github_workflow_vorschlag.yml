name: value-radar-update

# EINMAL taeglich. 06:00 UTC = 08:00 deutscher Sommerzeit, 07:00 Winterzeit.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    # 60 statt 45 Minuten: Reine Sicherheitsmarge. Das eigentliche Limit setzt
    # PRECOMPUTE_BUDGET_MIN weiter unten - der Lauf stoppt sich selbst und
    # SPEICHERT, statt von GitHub hart abgeschnitten zu werden. Der Unterschied
    # ist entscheidend: Lauf #162 lief 45m23s und hinterliess nichts.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        working-directory: value_radar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Neu berechnen (Scores, Radar, Quantum, Portfolio, Hedgefonds)
        working-directory: value_radar
        env:
          # --- Zeitsteuerung ---
          # Der Lauf bricht seine Scans nach 80 % dieses Budgets ab und nutzt
          # den Rest zum Speichern. Optionale Abschnitte (Earnings-Call-Suche,
          # KI-Briefing, Auto-Depot) entfallen vorher.
          # UMFANG. Gemessen in Lauf #166: 4,9 s je Titel, weil der flache
          # Pfad ueber yfinance laeuft statt ueber roics Sparfassung. Bei 600
          # Titeln sind das allein fuer den Screener 49 Minuten.
          #
          # Solange das nicht behoben ist, muss die Menge runter. Ein
          # Zeitbudget gleicht einen langsamen Datenpfad nicht aus - es
          # schneidet nur ab, und dann fehlen jeden Tag andere Titel.
          #
          # 250/150/100 passen rechnerisch in gut 25 Minuten. Sobald der
          # roic-Pfad greift, koennen die Werte wieder hoch.
          UNIVERSE_SIZE: "250"
          MOM_UNIVERSE_SIZE: "150"
          RADAR_MARKT: "100"
          PRECOMPUTE_BUDGET_MIN: "38"
          # Obergrenze fuer JEDEN einzelnen Netzabruf. Ohne sie blockiert ein
          # haengender Server unbegrenzt - im Protokoll von Lauf #164 waren das
          # stille Pausen von 19, 16 und 10 Minuten.
          NETZ_TIMEOUT_S: "20"
          # Titel fuer die Earnings-Call-Suche. Der teuerste Einzelabschnitt.
          TRANSKRIPT_DECKEL: "400"
          # --- Pflicht: Speicher ---
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          # --- Pflicht: Datenquellen ---
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          # --- Optional ---
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_BRIEFING_MODEL: ${{ secrets.AI_BRIEFING_MODEL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python precompute.py
