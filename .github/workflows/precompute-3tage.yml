name: precompute-3tage

# ALLE 3 TAGE der grosse Lauf: Fundamentaldaten, Fair Value, Scores fuer das
# grosse Universum (S&P500 + NASDAQ100 + STOXX600 + Nikkei225, ~1350 Titel).
# Schreibt ins Google Sheet (Streamlit) UND als JSON (Cloudflare).
#
# Alle 3 Tage reicht, weil sich Fundamentaldaten kaum bewegen. Kurse holen
# Streamlit und Cloudflare live. Um 03:00 UTC - zeitversetzt zum Earnings-Lauf
# (06:00), damit sie sich nicht das roic-Ratenlimit (300/min) teilen muessen.
on:
  schedule:
    - cron: "17 1 * * *"    # daily
  workflow_dispatch: {}

jobs:
  precompute:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # noetig fuer git push (sonst 403)
    # 180 min: roic-Ratenlimit (300/min) bremst, nicht das GitHub-Fenster.
    # ~1350 Titel x 15 Aufrufe / 300 = ~67 min reine Abrufzeit + Puffer.
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Abhaengigkeiten installieren
        working-directory: value_radar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 1) Streamlit-Nachtlauf (Sheet) - das grosse Universum
      - name: Streamlit-Daten berechnen
        working-directory: value_radar
        env:
          UNIVERSE_SIZE: "600"
          MOM_UNIVERSE_SIZE: "400"
          RADAR_MARKT: "200"
          PRECOMPUTE_BUDGET_MIN: "80"
          NETZ_TIMEOUT_S: "20"
          TRANSKRIPT_DECKEL: "0"     # Earnings laeuft im taeglichen Workflow
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GCP_SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python precompute.py

      # 2) Cloudflare-Export (JSON) - dasselbe Universum, schlank
      - name: Cloudflare-JSON exportieren
        working-directory: value_radar
        env:
          EXPORT_BUDGET_MIN: "160"
          NETZ_TIMEOUT_S: "20"
          ROIC_API_KEY: ${{ secrets.ROIC_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python export_cf.py

      # 3) JSON ins Repo committen, damit Cloudflare sie lesen kann
      - name: JSON committen
        working-directory: value_radar
        run: |
          git config user.name "value-radar-bot"
          git config user.email "bot@value-radar"
          git add daten/cf_universum.json
          git commit -m "Cloudflare-Universum aktualisiert [skip ci]" || echo "keine Aenderung"
          git push || echo "push uebersprungen"
