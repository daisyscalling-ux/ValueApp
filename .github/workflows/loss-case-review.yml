name: loss-case-review
on:
  workflow_dispatch: {}
  push:
    branches: ['claude/loss-case-review']
    paths:
      - 'value_radar/sec_pilot/loss_case_review.py'
      - 'value_radar/sec_pilot/loss_case_candidates.json'
      - '.github/workflows/loss-case-review.yml'
  pull_request:
    paths:
      - 'value_radar/sec_pilot/loss_case_review.py'
      - 'value_radar/sec_pilot/test_loss_case_review.py'
      - 'value_radar/sec_pilot/loss_case_candidates.json'
      - '.github/workflows/loss-case-review.yml'
permissions:
  contents: read
concurrency:
  group: loss-case-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install yfinance==0.2.66 pandas==2.3.3
      - run: python -m unittest discover -s value_radar/sec_pilot -p 'test_loss_case_review.py'
      - name: SEC-Belege und Kursreihen-Kandidaten sammeln
        if: github.event_name != 'pull_request'
        working-directory: value_radar/sec_pilot
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python loss_case_review.py ${{ github.workspace }}/loss-case-output
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name != 'pull_request'
        with:
          name: loss-case-review-${{ github.run_id }}
          path: loss-case-output/
          retention-days: 90
